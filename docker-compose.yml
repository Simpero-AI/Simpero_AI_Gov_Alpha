version: "3.9"

# No Postgres or Valkey service — the app connects to DigitalOcean managed clusters for both.
# DATABASE_URL (dd_app, via PgBouncer), ALEMBIC_DATABASE_URL (doadmin, direct to DO), and
# VALKEY_URL (DO Managed Valkey, direct — no local pooler) are provided via the .env file.

services:
  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - "5432:5432"
    volumes:
      - ./docker/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    environment:
      DD_APP_PASSWORD: "${DD_APP_PASSWORD}"
      DD_PUBLIC_PASSWORD: "${DD_PUBLIC_PASSWORD}"
    # The edoburu image MD5-hashes DB_PASSWORD before writing userlist.txt, which breaks
    # SCRAM-SHA-256 backend auth on DigitalOcean. We bypass its entrypoint and write the
    # plain text password ourselves so PgBouncer can compute the SCRAM response.
    entrypoint:
      - sh
      - -c
      - |
        printf '"dd_app" "%s"\n' "$$DD_APP_PASSWORD" > /etc/pgbouncer/userlist.txt
        printf '"dd_public" "%s"\n' "$$DD_PUBLIC_PASSWORD" >> /etc/pgbouncer/userlist.txt
        exec /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - pgbouncer
    restart: unless-stopped
    # DATABASE_URL in .env must point to pgbouncer:5432 (the service above), not directly to DO.
    # ALEMBIC_DATABASE_URL in .env points directly to the DO cluster — used only for migrations,
    # never at runtime.

  worker:
    build: .
    command: ["saq", "app.jobs.worker.settings"]
    env_file:
      - .env
    restart: unless-stopped
    # Runs the SAQ worker that actually executes jobs — the app service only enqueues them.
    # Connects to VALKEY_URL directly (DO Managed Valkey); no local pooler needed for Redis/Valkey.

networks:
  default:
    name: simpero-network
