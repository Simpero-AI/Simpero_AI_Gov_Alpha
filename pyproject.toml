[project]
name = "simpero-backend"
version = "0.1.0"
description = "AI-powered due diligence platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.0.0",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.12",
    "boto3>=1.34.0",
    "saq[redis,web]>=0.26.4",
    "pgvector>=0.5.0",
    "email-validator>=2.3.0",
    # Real production dependency, not dev-only: app/jobs/tasks/
    # start_deal_verification.py imports it to validate claims/edges against
    # contracts/claims.schema.json inside the actual worker job, not just in
    # scripts/tests. Was previously only in [dependency-groups].dev, which
    # `docker build` never installs (Dockerfile's `uv sync --frozen --no-dev`)
    # -- masked locally because a plain `uv sync` installs dev deps too, only
    # surfaced as ModuleNotFoundError inside the real worker container.
    "jsonschema>=4.0.0",
    # Real production dependency: app/services/screening/rulebook.py loads
    # track_b.yaml at evaluator call time, not just in tests -- same
    # dependencies-not-dev-group reasoning as jsonschema above.
    "pyyaml>=6.0",
]
# Docling/pypdf/openpyxl (the parse-service-only deps) left with
# services/parser + tests/parser in the Simpero_Gov_AI_Services split
# (2026-07-17) — this app never imports them. boto3 stays: kept for future
# Spaces access from this app (e.g. an upload path), not because anything
# here uses it yet.

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pyright>=1.1.411",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "local_corpus: supplementary tests against real corpus documents available only on some local machines (not committed, may contain confidential content). Always explicitly skipped, never silently, when the fixture isn't present. Not required for CI; do not rely on these for coverage.",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "F401"]
"tests/*" = ["E501"]
"contracts/*" = ["E501"]
