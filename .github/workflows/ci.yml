name: CI

# Runs on every PR into main or staging, and reused by deploy.yml's `ci` job.
on:
  pull_request:
    branches: [main, staging]
  workflow_call:
    # Lets deploy.yml's `ci` job (uses: ./.github/workflows/ci.yml) reuse
    # these jobs instead of duplicating them — required, not optional:
    # GitHub rejects a `uses:`-called workflow that lacks this trigger.

# Cancel superseded runs on the same PR/branch to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the Python version to the repo's requires-python (3.11).
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # 1. LINT — ruff (style + a class of real bugs: unused vars, unreachable code)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # ruff check = lint; ruff format --check = formatting-as-lint (non-mutating).
      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  # ---------------------------------------------------------------------------
  # 2. TYPECHECK — pyright (the repo already ships pyrightconfig.json)
  #    Load-bearing for the PageIndex / char_map invariants: a type error here
  #    is exactly the kind of drift that silently breaks provenance.
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: pyright
        run: uv run pyright

  # ---------------------------------------------------------------------------
  # 3. TEST — pytest.
  #    The parse-service unit tests (DS-1 len(text)==len(char_map) invariant,
  #    resolver fail-closed cases, scale tests) moved out with
  #    services/parser/tests/parser into Simpero_Gov_AI_Services — run its own
  #    CI, not this one. What remains here is app/ + the claims-schema
  #    contract test (contracts/, still duplicated in both repos).
  # ---------------------------------------------------------------------------
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    # Real Postgres — tests exercise RLS policies and current_setting(), which
    # SQLite can't do (see CLAUDE.md). pgvector/pgvector:pg16 matches the
    # sandbox/dev image since a migration enables the pgvector extension.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: doadmin
          POSTGRES_PASSWORD: ci_doadmin_pw
          POSTGRES_DB: simpero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doadmin -d simpero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    # ALEMBIC_DATABASE_URL runs migrations as doadmin (DDL). DATABASE_URL is
    # dd_app (DML only, RLS-restricted) — created by the "Create dd_app role"
    # step below, since GitHub's service containers start before checkout and
    # can't mount sandbox/init/01-app-role.sql the way docker-compose.dev.yml does.
    env:
      DATABASE_URL: "postgresql+asyncpg://dd_app:ci_dd_app_pw@localhost:5432/simpero"
      ALEMBIC_DATABASE_URL: "postgresql+psycopg2://doadmin:ci_doadmin_pw@localhost:5432/simpero"
      PUBLIC_DATABASE_URL: "postgresql+asyncpg://dd_public:ci_dd_public_pw@localhost:5432/simpero"
      CLERK_SECRET_KEY: "ci-dummy"
      CLERK_JWKS_URL: "https://example.test/.well-known/jwks.json"
      VALKEY_URL: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Migrations reference dd_app by name (bootstrap_dd_app_privliges.py,
      # the RLS policy migrations) — mirrors sandbox/init/01-app-role.sql.
      - name: Create dd_app role
        env:
          PGPASSWORD: ci_doadmin_pw
        run: |
          psql -h localhost -U doadmin -d simpero -c "CREATE ROLE dd_app WITH LOGIN PASSWORD 'ci_dd_app_pw'"
          psql -h localhost -U doadmin -d simpero -c "GRANT CONNECT ON DATABASE simpero TO dd_app"

      # dd_public is the External Deal Intake Link feature's RLS-restricted
      # external-facing role — mirrors sandbox/init/02-public-role.sql.
      - name: Create dd_public role
        env:
          PGPASSWORD: ci_doadmin_pw
        run: |
          psql -h localhost -U doadmin -d simpero -c "CREATE ROLE dd_public WITH LOGIN PASSWORD 'ci_dd_public_pw'"
          psql -h localhost -U doadmin -d simpero -c "GRANT CONNECT ON DATABASE simpero TO dd_public"

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: pytest
        run: uv run pytest -q --maxfail=1

  # ---------------------------------------------------------------------------
  # 4. BUILD / IMPORT-SMOKE — confirm the service actually imports and the
  #    package builds. Catches "it typechecks but doesn't run."
  # ---------------------------------------------------------------------------
  build:
    name: Build + import smoke
    runs-on: ubuntu-latest
    # See the test job: import-smoke constructs Settings() at import time.
    env:
      DATABASE_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci"
      ALEMBIC_DATABASE_URL: "postgresql+psycopg2://ci:ci@localhost:5432/ci"
      PUBLIC_DATABASE_URL: "postgresql+asyncpg://dd_public:ci_dd_public_pw@localhost:5432/simpero"
      CLERK_SECRET_KEY: "ci-dummy"
      CLERK_JWKS_URL: "https://example.test/.well-known/jwks.json"
      VALKEY_URL: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Import the FastAPI app object — fails if a module-level error exists.
      - name: Import app
        run: uv run python -c "import app.main"

      # Build the wheel (hatchling) — confirms packaging is intact.
      - name: Build wheel
        run: uv build

      # Actually build the deploy image — the wheel build above and the
      # import-smoke above it do NOT exercise Dockerfile, and deploy.yml's
      # docker-publish job builds this same Dockerfile for real. Catches
      # missing COPY paths (e.g. alembic.ini/alembic/, needed for
      # `docker compose run --rm app alembic upgrade head` in production)
      # before they reach a real deploy instead of after.
      - name: Build Docker image
        run: docker build -t ci-image-smoke .

      # Confirm the image actually contains what `alembic upgrade head`
      # needs at deploy time — a real regression check, not just "did it
      # build". Fails loudly if the Dockerfile's alembic COPY lines regress.
      - name: Verify image has alembic config + migrations
        run: |
          docker run --rm ci-image-smoke test -f /app/alembic.ini
          docker run --rm ci-image-smoke test -d /app/alembic/versions

  # ---------------------------------------------------------------------------
  # 5. DEPENDENCY / VULNERABILITY CHECK — pip-audit over the resolved env.
  #    Non-blocking for now (continue-on-error) so a brand-new advisory
  #    doesn't wedge every PR — flip to blocking once the dep tree is stable.
  #    (Docling and its large ML dep tree moved out with services/parser —
  #    see Simpero_Gov_AI_Services — so this app's own audit surface is small.)
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: pip-audit
        continue-on-error: true
        run: uv run --with pip-audit pip-audit

  # ---------------------------------------------------------------------------
  # 7. CLAIMS-SCHEMA CONTRACT VALIDATION — the project-specific check.
  #    The Python parse service (now Simpero_Gov_AI_Services) emits claims as
  #    JSON across the seam to this app / the TS app. This job validates that
  #    emitted shape against the shared JSON Schema (the C3 contract, owned by
  #    Simpero_Gov_AI_Services — this repo pins a copy), so a silent drift at
  #    the seam — the exact failure mode the product exists to prevent — fails
  #    CI instead of reaching production. Runs on every PR; cheap.
  #    (Secret scanning = job #5 in the plan — that's a repo *setting*
  #    -- GitHub native secret scanning + push protection -- not a workflow.
  #    See ci-setup-notes.md.)
  # ---------------------------------------------------------------------------
  contract:
    name: Claims-schema contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Validates a sample of emitted claim JSON against contracts/claims.schema.json
      # (the shared source of truth the consuming side also validates against).
      # See contracts/test_claims_contract.py for the check.
      - name: Validate claims JSON against shared schema
        run: uv run --with jsonschema pytest -q contracts/test_claims_contract.py
